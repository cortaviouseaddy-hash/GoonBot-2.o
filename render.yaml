services:
  - type: worker
    name: goonbot
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/cortaviouseaddy-hash/GoonBot-2.o
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: FOUNDER_USER_ID
        value: "606274733750878218"
      - key: SHERPA_ASSISTANT_ROLE_ID
        value: "1278022068591530085"
