name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py presets_loader.py env_safety.py

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          HOOK="${RENDER_DEPLOY_HOOK:-${RENDER_DEPLOY_HOOK_URL:-}}"

          if [ -n "$HOOK" ]; then
            echo "Triggering Render via deploy hook..."
            curl -fsS -X POST "$HOOK"
            echo "Render deploy hook accepted."
            exit 0
          fi

          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render via API..."
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo "Render API deploy accepted."
            exit 0
          fi

          echo "::error::Render deploy is NOT configured — GitHub pushes alone will not deploy this bot."
          echo ""
          echo "Add ONE of these in GitHub → Settings → Secrets and variables → Actions:"
          echo "  1) RENDER_DEPLOY_HOOK"
          echo "     Render Dashboard → goonbot → Settings → Deploy Hook → copy URL"
          echo "  2) RENDER_API_KEY + RENDER_SERVICE_ID"
          echo "     API key: Render Account Settings → API Keys"
          echo "     Service ID: srv-... from the goonbot service URL in Render"
          echo ""
          echo "Then re-run this workflow (Actions → Deploy to Render → Run workflow)"
          echo "or push any commit to main."
          exit 1
